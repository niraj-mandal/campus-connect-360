<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clubs & Communities · Campus Connect 360</title>
  <meta name="description" content="Browse student clubs and send a request to join.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/components.css">
  <script>
    (function () { let t = null; try { t = localStorage.getItem('cc-theme'); } catch (e) {} if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; })();
  </script>
</head>
<body data-page="clubs">
  <header id="site-header"></header>
  <main id="main">
    <section class="page-head">
      <div class="container">
        <p class="crumbs"><a href="/">Home</a> / Clubs</p>
        <h1>Clubs &amp; Communities</h1>
        <p class="lead">Find your people. Browse every student club, see when they meet, and send a request to join.</p>
      </div>
    </section>
    <section class="container section">
      <div class="toolbar">
        <div class="chips" id="club-filters" aria-label="Filter by category"></div>
        <label class="search-field"><svg><use href="#i-search"/></svg><input id="club-search" type="search" placeholder="Search clubs" aria-label="Search clubs"></label>
      </div>
      <div class="card-grid" id="club-grid" aria-live="polite"></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="/common.js"></script>
  <script src="/clubs.js"></script>
</body>
</html>
