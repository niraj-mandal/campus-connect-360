<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Organizer Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/components.css">
  <script>
    (function () { let t = null; try { t = localStorage.getItem('cc-theme'); } catch (e) {} if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.dataset.theme = t; })();
  </script>
  <style>
    .admin { padding-block: 32px 64px; }
    .admin-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .admin-head h1 { font-size: clamp(28px, 4vw, 36px); }
    .admin-head p { margin: 8px 0 0; color: var(--muted); font-size: 14px; }
    .key-form { max-width: 420px; margin: 60px auto; }
    .key-form .reg-card { display: grid; gap: 14px; }
    .key-form input { width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 14px; font-size: 13px; }
    .key-form p { margin: 0; color: var(--muted); font-size: 13px; }
    .panel-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .panel-tools .select-wrap select { height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 36px 0 12px; font-size: 13px; appearance: none; }
    .summary { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill { background: var(--surface-2); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; }
    .pill b { font-variant-numeric: tabular-nums; }
    .table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
    table.data { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
    table.data th, table.data td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    table.data th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; white-space: nowrap; }
    table.data tbody tr:last-child td { border-bottom: 0; }
    table.data tbody tr:hover { background: var(--surface-2); }
    table.data td.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; white-space: nowrap; }
    table.data td.wrap { max-width: 340px; white-space: pre-line; }
    table.data td.nowrap { white-space: nowrap; }
    .row-actions { display: flex; gap: 4px; flex-wrap: wrap; }
    .act { border: 0; background: none; cursor: pointer; font-size: 12.5px; font-weight: 600; padding: 4px 8px; border-radius: 6px; color: var(--text); white-space: nowrap; }
    .act:hover { background: var(--surface-2); }
    .act.danger { color: var(--error); }
    .act.danger:hover { background: color-mix(in srgb, var(--error) 12%, transparent); }
    .empty { padding: 40px 16px; text-align: center; color: var(--muted); font-size: 14px; }
    .add-card { margin-bottom: 18px; }
    .add-card summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
    .add-card[open] summary { margin-bottom: 14px; }
    .check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
    .storage-warn { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body data-page="admin">
  <header id="site-header" class="site-header" data-static="1">
    <div class="container header-inner">
      <a class="brand" href="/"><svg class="brand-logo"><use href="#logo"/></svg><span>Campus Connect 360</span></a>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode"><svg><use href="#i-moon"/></svg></button>
        <button class="btn btn-sm btn-outline" id="sign-out" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main class="container admin" id="main">
    <section class="key-form" id="key-view" hidden>
      <form class="reg-card" id="key-form">
        <h3>Organizer access</h3>
        <p>Enter the organizer key to manage events, notices, clubs, posts, tickets and messages.</p>
        <input id="key-input" type="password" placeholder="Organizer key" autocomplete="current-password" required aria-label="Organizer key">
        <small class="error" id="key-error" aria-live="polite"></small>
        <button class="btn btn-dark btn-block" type="submit">Sign in</button>
      </form>
    </section>

    <section id="data-view" hidden>
      <div class="admin-head">
        <div>
          <p class="eyebrow">Organizer</p>
          <h1>Dashboard</h1>
          <p id="updated"></p>
        </div>
        <button class="btn btn-sm btn-outline" id="refresh">Refresh</button>
      </div>
      <div id="storage-note"></div>
      <div class="tabs" role="tablist" aria-label="Sections" id="tabs"></div>
      <div id="panel" role="tabpanel"></div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
